<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>My Portfolio</h1>
    <nav>
      <ul>
        <li><a href="#about" aria-label="About section">About</a></li>
        <li><a href="#projects" aria-label="Projects section">Projects</a></li>
        <li><a href="#contact" aria-label="Contact section">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="about">
      <h2>About Me</h2>
      <p>Hello! I am a web developer passionate about building interactive websites.</p>
      <img src="profile.jpg" alt="Profile picture of me" width="200" />
    </section>

    <section id="projects">
      <h2>Projects</h2>
      <ul>
        <li><strong>Project 1:</strong> Responsive Portfolio Website</li>
        <li><strong>Project 2:</strong> JavaScript To-Do List App</li>
      </ul>
    </section>

    <section id="contact">
      <h2>Contact Me</h2>
      <form id="contactForm" aria-label="Contact form">
        <label for="name">Name:</label><br />
        <input type="text" id="name" name="name" required /><br />

        <label for="email">Email:</label><br />
        <input type="email" id="email" name="email" required /><br />

        <label for="message">Message:</label><br />
        <textarea id="message" name="message" rows="4" required></textarea><br />

        <button type="submit">Send</button>
      </form>
      <p id="responseMessage" role="alert" aria-live="polite"></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 My Portfolio</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
